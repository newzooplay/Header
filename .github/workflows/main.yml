name: M3U8 Debugger

on:
  workflow_dispatch:
    inputs:
      playlist_url:
        description: "Authorized M3U8 playlist URL"
        required: true
        type: string

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install requests

      - name: Inspect M3U8 playlist
        env:
          PLAYLIST_URL: ${{ inputs.playlist_url }}
        run: |
          python - <<'PY'
          import os
          import requests
          from urllib.parse import urlparse

          url = os.environ.get("PLAYLIST_URL", "").strip()
          parsed = urlparse(url)

          if parsed.scheme != "https" or not parsed.hostname:
              raise SystemExit("ERROR: Enter a valid HTTPS URL.")

          if parsed.username or parsed.password:
              raise SystemExit("ERROR: Credentials in URLs are not allowed.")

          print("Checking playlist host:", parsed.hostname)

          try:
              response = requests.get(
                  url,
                  headers={
                      "User-Agent": "M3U8-Debugger/1.0",
                      "Accept": "application/vnd.apple.mpegurl, "
                                "application/x-mpegURL, */*"
                  },
                  timeout=20,
                  allow_redirects=True,
                  stream=True
              )

              print("HTTP Status:", response.status_code)
              print("Redirect Count:", len(response.history))
              print("Final Host:", urlparse(response.url).hostname)
              print(
                  "Content-Type:",
                  response.headers.get("Content-Type", "Unknown")
              )

              for index, redirect in enumerate(response.history, start=1):
                  print(
                      f"Redirect {index}:",
                      redirect.status_code,
                      urlparse(redirect.url).hostname
                  )

              if response.ok:
                  first_line = next(response.iter_lines(), b"")
                  first_line = first_line.decode(
                      "utf-8", errors="replace"
                  )

                  print("First line:", first_line[:150])
                  print(
                      "M3U8 detected:",
                      first_line.lstrip().startswith("#EXTM3U")
                  )
              else:
                  print("The server returned an HTTP error.")

              response.close()

          except requests.RequestException as error:
              print("Request failed:", type(error).__name__)
              print("Details:", str(error)[:250])
              raise SystemExit(1)
          PY
