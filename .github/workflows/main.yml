name: M3U8 Debugger

on:
workflow_dispatch:
inputs:
playlist_url:
description: "Authorized M3U8 URL"
required: true
type: string

permissions:
contents: read

jobs:
check:
runs-on: ubuntu-latest
steps:
- name: Setup Python
uses: actions/setup-python@v5
with:
python-version: "3.12"

  - name: Inspect playlist
    env:
      PLAYLIST_URL: ${{ inputs.playlist_url }}
    run: |
      python -m pip install requests
      python - <<'PY'
      import os
      import requests
      from urllib.parse import urlparse

      url = os.environ["PLAYLIST_URL"].strip()
      p = urlparse(url)

      if p.scheme != "https" or not p.hostname:
          raise SystemExit("Enter a valid HTTPS URL")

      print("Host:", p.hostname)

      try:
          r = requests.get(
              url,
              headers={"User-Agent": "M3U8-Debugger/1.0"},
              timeout=20,
              allow_redirects=True,
              stream=True
          )

          print("HTTP status:", r.status_code)
          print("Redirects:", len(r.history))
          print("Content-Type:", r.headers.get("Content-Type"))
          print("Final host:", urlparse(r.url).hostname)

          if r.ok:
              first = next(r.iter_lines(), b"")
              print("First line:", first[:150].decode(
                  "utf-8", errors="replace"
              ))
              print(
                  "M3U8 detected:",
                  first.lstrip().startswith(b"#EXTM3U")
              )
          else:
              print("The server returned an HTTP error.")

          r.close()

      except requests.RequestException as e:
          print("Request failed:", type(e).__name__)
          print(str(e)[:250])
          raise SystemExit(1)
      PY
